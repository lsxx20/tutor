<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>課程進度</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23ffffff'/%3E%3Crect x='2' y='2' width='96' height='96' rx='20' fill='none' stroke='%23E4DFD3' stroke-width='3'/%3E%3Cg stroke-linecap='round'%3E%3Cline x1='31' y1='39' x2='61' y2='39' stroke='%233E726B' stroke-width='8'/%3E%3Cline x1='31' y1='53' x2='69' y2='53' stroke='%232B2723' stroke-width='8'/%3E%3Cline x1='31' y1='67' x2='55' y2='67' stroke='%232B2723' stroke-width='8'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF;
    --text:#2B2B2B;
    --text-soft:#6F6F6F;
    --teal:#3E726B;
    --teal-hover:#2D544F;
    --border:#DBDBDB;
    --border-strong:#C4C4C4;
    --header:#1A1A1A;
    --sans:"Noto Sans TC", system-ui, -apple-system, "Helvetica Neue", sans-serif;
  }

  *{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; }

  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    font-size:15px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }

  .wrap{
    max-width:980px;
    margin:0 auto;
    padding:clamp(2rem,5vw,3.5rem) clamp(1rem,4vw,2rem) clamp(3rem,7vw,4.5rem);
  }

  .course-title{
    font-weight:700;
    font-size:clamp(1.5rem,4vw,1.95rem);
    color:var(--header);
    margin:0 0 .45rem;
    letter-spacing:.01em;
  }
  .course-desc{
    color:var(--text-soft);
    font-size:.95rem;
    margin:0 0 1.4rem;
    max-width:54ch;
  }

  /* ── 分頁切換 ── */
  .tabs{
    display:flex;
    gap:1.5rem;
    border-bottom:1px solid var(--border);
    margin:0 0 1.1rem;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{ display:none; }
  .tab{
    appearance:none;
    background:none;
    border:0;
    border-bottom:2px solid transparent;
    margin-bottom:-1px;
    padding:.45rem .1rem .55rem;
    font-family:var(--sans);
    font-size:.95rem;
    font-weight:500;
    color:var(--text-soft);
    white-space:nowrap;
    cursor:pointer;
    transition:color .15s ease, border-color .15s ease;
  }
  .tab:hover{ color:var(--text); }
  .tab[aria-selected="true"]{ color:var(--header); font-weight:700; border-bottom-color:var(--teal); }
  .tab:focus-visible{ outline:2px solid var(--teal); outline-offset:2px; border-radius:2px; }

  .controls{
    display:flex;
    justify-content:flex-end;
    align-items:center;
    margin:0 0 .85rem;
  }
  .search{ position:relative; display:flex; align-items:center; }
  .search .glass{ position:absolute; left:.1rem; color:var(--text-soft); display:flex; pointer-events:none; }
  .search input{
    appearance:none;
    background:none;
    border:0;
    border-bottom:1px solid var(--border-strong);
    padding:.25rem .2rem .3rem 1.5rem;
    width:11rem;
    max-width:60vw;
    font-family:var(--sans);
    font-size:.86rem;
    color:var(--text);
    transition:border-color .15s ease, width .2s ease;
  }
  .search input::placeholder{ color:var(--text-soft); }
  .search input:focus{ outline:none; border-bottom-color:var(--teal); width:13rem; }

  .schedule{
    width:100%;
    border-collapse:collapse;
    font-size:.92rem;
  }
  .schedule th{
    text-align:left;
    vertical-align:bottom;
    font-weight:700;
    color:var(--header);
    padding:.65rem .8rem;
    border:1px solid var(--border);
    border-bottom:2px solid var(--border-strong);
    background:var(--bg);
    white-space:nowrap;
  }
  .schedule td{
    vertical-align:top;
    padding:.8rem .8rem;
    border:1px solid var(--border);
  }

  .lec-cell{ white-space:nowrap; font-weight:600; color:var(--text); }
  .lec-date{
    display:block;
    margin-top:.15rem;
    font-size:.78rem;
    font-weight:400;
    color:var(--text-soft);
  }

  .cell-item{ margin-bottom:.32rem; }
  .cell-item:last-child{ margin-bottom:0; }

  .ref-note{
    margin-top:.4rem;
    font-size:.82rem;
    color:var(--text-soft);
    line-height:1.5;
  }
  .ref-note .ref-label{ color:var(--text-soft); }

  a.link{
    color:var(--teal);
    text-decoration:none;
    transition:color .15s ease;
  }
  a.link:hover{ color:var(--teal-hover); text-decoration:underline; text-underline-offset:2px; }
  a.link:focus-visible{ outline:2px solid var(--teal); outline-offset:2px; border-radius:2px; }

  .muted{ color:var(--text-soft); }

  .dl{
    display:inline-flex;
    vertical-align:-2px;
    margin-left:.28rem;
    color:var(--teal);
    transition:transform .15s ease, color .15s ease;
  }
  a.link:hover .dl{ color:var(--teal-hover); transform:translateY(2px); }
  .dl svg{ display:block; width:13px; height:13px; }

  .bracket{ color:var(--text-soft); }

  .empty-state{ padding:2.5rem .8rem; color:var(--text-soft); }
  .empty-state .accent{ color:var(--text); font-weight:500; }

  /* ── 科目講義頁（單元排列）── */
  .unit-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:.8rem;
    padding:0 .1rem .5rem;
    border-bottom:2px solid var(--border-strong);
    margin-bottom:.1rem;
  }
  .unit-head .h{ font-size:.86rem; font-weight:700; color:var(--header); }
  .unit-head .n{ font-size:.78rem; font-weight:400; color:var(--text-soft); }

  .unit{
    display:grid;
    grid-template-columns:13rem 1fr;
    gap:.5rem 1.4rem;
    padding:.85rem .1rem;
    border-bottom:1px solid var(--border);
  }
  .unit-no{
    color:var(--text-soft);
    font-size:.78rem;
    font-variant-numeric:tabular-nums;
    margin-right:.45rem;
  }
  .unit-name{
    font-weight:700;
    color:var(--header);
    font-size:.95rem;
  }
  .unit-files{
    display:flex;
    flex-direction:column;
    gap:.3rem;
    font-size:.92rem;
  }
  .file-item{ display:flex; gap:.6rem; align-items:baseline; }
  .file-note{
    font-size:.8rem;
    color:var(--text-soft);
    line-height:1.45;
    margin-top:.05rem;
  }
  .pending{
    display:inline-block;
    margin-left:.45rem;
    padding:.02rem .34rem;
    border:1px solid var(--border);
    border-radius:3px;
    font-size:.7rem;
    color:var(--text-soft);
    vertical-align:1px;
  }

  .colophon{
    margin-top:1.6rem;
    font-size:.78rem;
    color:var(--text-soft);
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:.5rem;
  }

  [hidden]{ display:none !important; }

  @media (max-width:720px){
    .schedule thead{ display:none; }
    .schedule,
    .schedule tbody,
    .schedule tr,
    .schedule td{ display:block; width:100%; }

    .schedule tr{
      border:1px solid var(--border);
      border-radius:5px;
      margin-bottom:1rem;
      overflow:hidden;
    }
    .schedule td{
      border:0;
      border-top:1px solid var(--border);
      padding:.6rem .9rem;
      display:flex;
      gap:.8rem;
    }
    .schedule td:empty{ display:none; }
    .schedule td::before{
      content:attr(data-label);
      flex:0 0 4rem;
      font-weight:700;
      color:var(--header);
      font-size:.82rem;
    }

    .lec-cell{
      border-top:0;
      background:#FAFAFA;
      font-weight:700;
      font-size:1rem;
      align-items:baseline;
      gap:.55rem;
    }
    .lec-cell::before{ content:""; flex:0; }
    .lec-date{ display:inline; margin-top:0; font-size:.82rem; }

    .unit{ grid-template-columns:1fr; gap:.45rem; }
    .unit-files{ padding-left:.2rem; }
  }

  @media (prefers-reduced-motion:reduce){
    a.link, .dl, .search input, .tab{ transition:none; }
    a.link:hover .dl{ transform:none; }
  }
</style>
</head>
<body>
  <main class="wrap">
    <header>
      <h1 class="course-title" id="courseTitle">高中社會</h1>
      <p class="course-desc" id="courseDesc">每堂課的內容、參考與練習，可直接下載。</p>
    </header>

    <div class="tabs" id="tabs" role="tablist" aria-label="頁面切換"></div>

    <div class="controls">
      <label class="search">
        <span class="glass" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
            <circle cx="7" cy="7" r="4.5"/><line x1="10.5" y1="10.5" x2="14" y2="14" stroke-linecap="round"/>
          </svg>
        </span>
        <input id="search" type="search" placeholder="搜尋課次或主題…" aria-label="搜尋課程">
      </label>
    </div>

    <section id="panel-schedule" role="tabpanel" aria-labelledby="tab-schedule">
      <table class="schedule">
        <colgroup>
          <col style="width:9%">
          <col style="width:59%">
          <col style="width:32%">
        </colgroup>
        <thead>
          <tr>
            <th scope="col">Lec</th>
            <th scope="col">課程內容</th>
            <th scope="col">練習</th>
          </tr>
        </thead>
        <tbody id="tbody" aria-live="polite"></tbody>
      </table>
    </section>

    <section id="panel-subject" role="tabpanel" hidden>
      <div id="subjectBody" aria-live="polite"></div>
    </section>

    <footer class="colophon">
      <span id="colophonLeft">由家教老師維護</span>
      <span id="colophonRight">最後更新 2026</span>
    </footer>
  </main>

<script>
/* ──────────────────────────────────────────────────────────
   設定區：換課程或換老師用，只動這塊
   ────────────────────────────────────────────────────────── */
const COURSE = {
  title: "高中社會",
  desc:  "每堂課的內容、參考與練習，可直接下載。",
  maintainer: "built by lsx",
  updated:    "2026"
};

/* 科目分頁：id 用英文（會變成網址 #hash），label 是分頁上的字，
   tag 是 data.json 標題裡 [ ] 的科目名稱。要加科目就在這裡多一筆。 */
const SUBJECTS = [
  { id:"geo",   label:"地理", tag:"地理" },
  { id:"his",   label:"歷史", tag:"歷史" },
  { id:"civic", label:"公民", tag:"公民" }
];

/* ── 資料來源（兩份，各自獨立）─────────────────────────────
   data.json      → 課程進度頁：每堂課上了什麼、發了什麼練習
   materials.json → 地理/歷史/公民 三個分頁：整套上課講義教材
   兩份都放在跟這個 HTML 同一個資料夾；更新內容只要改 json，HTML 不用動。
   讀不到時會退回下方的內建範例，方便本機預覽。

   materials.json 格式：
   [
     { "subject": "地理",                        ← 要對到上面 SUBJECTS 的 tag
       "units": [
         { "unit": "地形",                        ← 單元名稱，照順序顯示
           "items": [
             { "title": "冰河地形",                ← 教材標題
               "url":   "materials/地形_冰河.pdf", ← 檔案路徑；留空 "" 會顯示「待補」
               "note":  "含練習題解答" }           ← 備註，可省略
           ] }
       ] }
   ] */

/* 每筆 = 一堂課，依陣列順序自動編成 Lec 1、Lec 2…：
   - date：上課日期（選填），顯示在 Lec 編號下方
   - content：課程內容，項目有 url 會顯示下載箭頭
     ↳ 標題開頭寫 [歷史] / [地理] / [公民]，就會自動進到對應的科目分頁
   - reference：參考章節，顯示在內容下方；有 url 則變連結
   - sheets：練習，有 url 顯示下載箭頭，bracket:true 會用 [ ] 包起來（如解答） */
const SAMPLE_DATA = [
  { date:"9/2",
    content:[{ title:"[地理] 地圖概念（P.1–6）", url:"#" }],
    reference:[{ label:"課本 1-1 地圖要素" }, { label:"1-2 GIS 概論" }],
    sheets:[{ title:"習題 1", url:"#" }, { title:"解答", url:"#", bracket:true }] },

  { date:"9/4",
    content:[{ title:"[地理] 氣候系統（P.7–14）", url:"#" }],
    reference:[{ label:"課本 2-1 氣候類型" }, { label:"2-3 水文循環" }],
    sheets:[] },

  { date:"9/9",
    content:[{ title:"[歷史] 臺灣移民史（P.15–22）", url:"#" }],
    reference:[{ label:"課本 3-2 開港通商" }],
    sheets:[{ title:"習題 2", url:"#" }, { title:"解答", url:"#", bracket:true }] },

  { date:"9/11",
    content:[{ title:"[歷史] 臺灣的現代化進程（P.23–28）", url:"#" }],
    reference:[{ label:"課本 5-1 工業革命" }],
    sheets:[] },

  { date:"9/16",
    content:[{ title:"[公民] 政府體制與運作（P.29–34）", url:"#" }],
    reference:[{ label:"課本 7-1 民主原則" }, { label:"7-2 憲政體制" }],
    sheets:[{ title:"習題 3", url:"#" }] },

  { date:"9/18",
    content:[{ title:"[公民] 勞動參與、社會安全制度（P.35–40）", url:"#" }],
    reference:[{ label:"課本 8-1 供需法則" }],
    sheets:[] },

  { date:"9/23",
    content:[{ title:"[公民] 媒體與公共意見（P.41–48）", url:"#" }],
    reference:[{ label:"課本 9-1 地方自治" }],
    sheets:[{ title:"習題 4", url:"#" }, { title:"解答", url:"#", bracket:true }] }
];

/* materials.json 讀不到時的內建範例 */
const SAMPLE_MATERIALS = [
  { subject:"地理", units:[
    { unit:"地形", items:[
      { title:"內營力與外營力", url:"#", note:"" },
      { title:"河流地形",       url:"",  note:"整理中" }
    ] },
    { unit:"氣候系統", items:[ { title:"氣候系統 講義", url:"#", note:"" } ] }
  ] },
  { subject:"歷史", units:[
    { unit:"臺灣移民史", items:[ { title:"臺灣移民史 講義", url:"#", note:"" } ] }
  ] },
  { subject:"公民", units:[
    { unit:"國家組成與認同", items:[ { title:"國家組成與認同 講義", url:"#", note:"" } ] }
  ] }
];

/* ──────────────────────────────────────────────────────────
   程式邏輯，通常不需修改
   ────────────────────────────────────────────────────────── */
const ICON_DL = '<span class="dl" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.5v8"/><path d="M4.5 7L8 10.5 11.5 7"/><path d="M2.8 13.2h10.4"/></svg></span>';

let allRows = [];
let allMaterials = [];
let searchTerm = "";
let activeTab = "schedule";   // "schedule" 或 SUBJECTS 裡的 id

function esc(s){
  return String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c]));
}

/* "20260701" → "7/1"；其他格式原樣輸出（只用在科目分頁） */
function fmtDate(d){
  const s = String(d ?? "").trim();
  const m = s.match(/^(\d{4})(\d{2})(\d{2})$/);
  return m ? `${Number(m[2])}/${Number(m[3])}` : s;
}

function applyCourseMeta(){
  document.title = COURSE.title;
  document.getElementById("courseTitle").textContent = COURSE.title;
  document.getElementById("courseDesc").textContent = COURSE.desc;
  document.getElementById("colophonLeft").textContent = COURSE.maintainer;
  document.getElementById("colophonRight").textContent = COURSE.updated;
}

async function loadJson(file, fallback){
  try{
    const res = await fetch(file, { cache:"no-store" });
    if(!res.ok) throw new Error("HTTP "+res.status);
    const data = await res.json();
    return Array.isArray(data) ? data : fallback;
  }catch(err){
    console.warn(`讀取 ${file} 失敗，改用內建範例：`, err);
    return fallback;
  }
}

function downloadLink(item, label){
  const dl = (item.url && item.url !== "#") ? ' download' : '';
  return `<a class="link" href="${esc(item.url || "#")}"${dl}>${esc(label ?? item.title)}${ICON_DL}</a>`;
}

/* ── 分頁 1：課程進度（維持原本行為，未更動）───────────── */

function contentCell(content, reference){
  let html = (content||[]).map(i => `<div class="cell-item">${downloadLink(i)}</div>`).join("");
  if(reference && reference.length){
    const refs = reference.map(i => i.url
      ? `<a class="link" href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.label)}</a>`
      : esc(i.label)
    ).join("、");
    html += `<div class="ref-note"><span class="ref-label">參考：</span>${refs}</div>`;
  }
  return html;
}

function sheetsCell(items){
  if(!items || !items.length) return "";
  return items.map(i => {
    const link = downloadLink(i);
    return `<div class="cell-item">${ i.bracket ? '<span class="bracket">[</span>'+link+'<span class="bracket">]</span>' : link }</div>`;
  }).join("");
}

function rowMatches(row){
  if(!searchTerm) return true;
  const parts = ["Lec " + row._lec, row.date || ""];
  (row.content||[]).forEach(i => parts.push(i.title));
  (row.reference||[]).forEach(i => parts.push(i.label));
  (row.sheets||[]).forEach(i => parts.push(i.title));
  return parts.join(" ").toLowerCase().includes(searchTerm.toLowerCase());
}

function renderSchedule(){
  const tbody = document.getElementById("tbody");
  const numbered = allRows.map((row, i) => Object.assign({}, row, { _lec: i + 1 }));
  const rows = numbered.filter(rowMatches);
  tbody.innerHTML = "";

  if(rows.length === 0){
    const tr = document.createElement("tr");
    tr.innerHTML = `<td colspan="3" class="empty-state">找不到「<span class="accent">${esc(searchTerm)}</span>」相關的課次。換個關鍵字試試。</td>`;
    tbody.appendChild(tr);
    return;
  }

  rows.forEach(row => {
    const tr = document.createElement("tr");
    const dateHtml = row.date ? `<span class="lec-date">${esc(row.date)}</span>` : "";
    tr.innerHTML =
      `<td class="lec-cell" data-label="Lec"><span>Lec ${row._lec}</span>${dateHtml}</td>` +
      `<td data-label="課程內容">${contentCell(row.content, row.reference)}</td>` +
      `<td data-label="練習">${sheetsCell(row.sheets)}</td>`;
    tbody.appendChild(tr);
  });
}

/* ── 分頁 2~4：地理 / 歷史 / 公民（來源 materials.json）── */

function itemMatches(unit, item){
  if(!searchTerm) return true;
  const hay = [unit, item.title, item.note].join(" ").toLowerCase();
  return hay.includes(searchTerm.toLowerCase());
}

function materialItem(item){
  const title = String(item.title || "").trim() || "（未命名）";
  const note  = String(item.note  || "").trim();
  const hasUrl = item.url && String(item.url).trim();
  const head = hasUrl
    ? downloadLink({ url:item.url }, title)
    : `<span class="muted">${esc(title)}</span><span class="pending">待補</span>`;
  return `<div class="file-item">
            <div>${head}${ note ? `<div class="file-note">${esc(note)}</div>` : "" }</div>
          </div>`;
}

function renderSubject(id){
  const sub  = SUBJECTS.find(s => s.id === id);
  const host = document.getElementById("subjectBody");
  if(!sub){ host.innerHTML = ""; return; }

  const entry = allMaterials.find(m => m.subject === sub.tag) || { units: [] };
  const units = (entry.units || [])
    .map(u => ({ unit:u.unit, items:(u.items || []).filter(it => itemMatches(u.unit, it)) }))
    .filter(u => u.items.length);

  if(!units.length){
    host.innerHTML = searchTerm
      ? `<div class="empty-state">找不到「<span class="accent">${esc(searchTerm)}</span>」相關的${esc(sub.label)}教材。換個關鍵字試試。</div>`
      : `<div class="empty-state">${esc(sub.label)}目前還沒有教材，到 <span class="accent">materials.json</span> 補上就會出現。</div>`;
    return;
  }

  const total = units.reduce((n, u) => n + u.items.length, 0);
  const body = units.map((u, i) => `
    <div class="unit">
      <div class="unit-name"><span class="unit-no">${String(i+1).padStart(2,"0")}</span>${esc(u.unit)}</div>
      <div class="unit-files">${u.items.map(materialItem).join("")}</div>
    </div>`).join("");

  host.innerHTML =
    `<div class="unit-head"><span class="h">${esc(sub.label)}　上課講義教材</span>` +
    `<span class="n">${units.length} 單元・${total} 份</span></div>` + body;
}

/* ── 分頁切換 ──────────────────────────────────────────── */

function buildTabs(){
  const tabs = document.getElementById("tabs");
  const all = [{ id:"schedule", label:"課程進度" }].concat(SUBJECTS);
  tabs.innerHTML = all.map(t =>
    `<button class="tab" id="tab-${t.id}" role="tab" type="button" data-tab="${t.id}"
             aria-selected="false" aria-controls="${t.id === "schedule" ? "panel-schedule" : "panel-subject"}">${esc(t.label)}</button>`
  ).join("");
  tabs.querySelectorAll(".tab").forEach(btn => {
    btn.addEventListener("click", () => setTab(btn.dataset.tab, true));
  });
}

function setTab(name, push){
  const valid = name === "schedule" || SUBJECTS.some(s => s.id === name);
  activeTab = valid ? name : "schedule";

  document.querySelectorAll(".tab").forEach(btn => {
    btn.setAttribute("aria-selected", btn.dataset.tab === activeTab ? "true" : "false");
  });
  const isSchedule = activeTab === "schedule";
  document.getElementById("panel-schedule").hidden = !isSchedule;
  document.getElementById("panel-subject").hidden  = isSchedule;
  document.getElementById("panel-subject").setAttribute("aria-labelledby", "tab-" + activeTab);
  document.getElementById("search").placeholder = isSchedule ? "搜尋課次或主題…" : "搜尋單元或教材…";

  if(push && location.hash.slice(1) !== activeTab){
    history.replaceState(null, "", "#" + activeTab);
  }
  render();
}

function render(){
  if(activeTab === "schedule") renderSchedule();
  else renderSubject(activeTab);
}

document.getElementById("search").addEventListener("input", e => {
  searchTerm = e.target.value.trim();
  render();
});

window.addEventListener("hashchange", () => setTab(location.hash.slice(1), false));

(async function init(){
  applyCourseMeta();
  buildTabs();
  document.getElementById("tbody").innerHTML = '<tr><td colspan="3" class="empty-state">載入課程中…</td></tr>';
  [allRows, allMaterials] = await Promise.all([
    loadJson("data.json", SAMPLE_DATA),
    loadJson("materials.json", SAMPLE_MATERIALS)
  ]);
  setTab(location.hash.slice(1) || "schedule", false);
})();
</script>
